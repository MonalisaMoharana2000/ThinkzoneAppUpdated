buildscript {
    ext {
        buildToolsVersion = "34.0.0"
        minSdkVersion = 23
        compileSdkVersion = 34
        targetSdkVersion = 34
        ndkVersion = "26.1.10909125"
        kotlinVersion = "1.9.24"
    }
    repositories {
        google()
        mavenCentral()
    }
    dependencies {
       // Specify a stable version for Android Gradle Plugin
        classpath("com.android.tools.build:gradle:8.1.1")
        
        // Specify React Native Gradle Plugin
        classpath("com.facebook.react:react-native-gradle-plugin:latest.release")  // use the latest release or specify a version
        
        // Use the Kotlin version specified in ext
        classpath("org.jetbrains.kotlin:kotlin-gradle-plugin:$kotlinVersion")
        
        // Google Services plugin for Firebase
        classpath 'com.google.gms:google-services:4.3.15' 
    }
}

apply plugin: "com.facebook.react.rootproject"
